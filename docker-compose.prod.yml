# Production stack — MySQL + API + Web (nginx)
# Usage on server:
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Images can also be pulled from GHCR after CI builds them.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tourpilot}
      MYSQL_USER: ${MYSQL_USER:-tourpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - tourpilot_mysql_data:/var/lib/mysql
    # Bind to localhost only — use SSH tunnel from your PC (do NOT open this port publicly).
    # Default 3307 avoids clashing with a host MySQL already on 3306 (common on VPS images).
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    command:
      [
        "--mysql-native-password=ON",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - tourpilot

  api:
    image: ${API_IMAGE:-tourpilot-api:local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-tourpilot}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-tourpilot}
      UPLOAD_DIR: /app/apps/api/uploads
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WEB_APP_URL: ${WEB_APP_URL}
      EMAIL_MODE: ${EMAIL_MODE:-log}
      EMAIL_FROM: ${EMAIL_FROM:-TourPilot <noreply@example.com>}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      DEV_BYPASS_OTP: ${DEV_BYPASS_OTP:-false}
      DEMO_OTP_IN_RESPONSE: ${DEMO_OTP_IN_RESPONSE:-false}
      LOG_OTP_TO_CONSOLE: ${LOG_OTP_TO_CONSOLE:-false}
      INQUIRY_EXPIRY_DAYS: ${INQUIRY_EXPIRY_DAYS:-14}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      PLATFORM_DOMAINS: ${PLATFORM_DOMAINS:-}
      CUSTOM_DOMAIN_A_TARGET: ${CUSTOM_DOMAIN_A_TARGET:-}
      CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      HEADLESS_CORS_ORIGINS: ${HEADLESS_CORS_ORIGINS:-}
      CORS_STRICT: ${CORS_STRICT:-false}
      BUILD_SHA: ${BUILD_SHA:-manual}
      BUILD_TIME: ${BUILD_TIME:-}
    volumes:
      - tourpilot_uploads:/app/apps/api/uploads
    networks:
      - tourpilot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    image: ${WEB_IMAGE:-tourpilot-web:local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - tourpilot

  # Edge reverse proxy with automatic HTTPS + On-Demand TLS for agency custom
  # domains. Opt-in: start with `--profile edge`. When enabled, set HTTP_PORT to
  # a non-80 value (e.g. 8080) so the web container doesn't clash with Caddy.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["edge"]
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-srilankatourpilot.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      # Explicit DEV hostname (must match DNS). Listed in Caddyfile too.
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.srilankatourpilot.com}
      # Host gateway + DEV HTTP_PORT — Path B reverse_proxy target.
      DEV_UPSTREAM: ${DEV_UPSTREAM:-host.docker.internal:8081}
    extra_hosts:
      # So Caddy can reach the DEV stack published on the VPS host (:8081).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - tourpilot_caddy_data:/data
      - tourpilot_caddy_config:/config
    networks:
      - tourpilot

volumes:
  tourpilot_mysql_data:
  tourpilot_uploads:
  tourpilot_caddy_data:
  tourpilot_caddy_config:

networks:
  tourpilot:
    driver: bridge
