name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/tourpilot-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/tourpilot-web

jobs:
  build-and-push:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${OWNER}/tourpilot-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER}/tourpilot-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}:latest
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: |
            VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
          tags: |
            ${{ steps.meta.outputs.web }}:latest
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # Secrets pasted from editors often include trailing whitespace.
      - name: Normalize SSH target
        id: ssh
        env:
          RAW_HOST: ${{ secrets.DEPLOY_HOST }}
          RAW_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          HOST="$(printf '%s' "$RAW_HOST" | tr -d '\r\n' | tr -d '[:space:]')"
          PORT="$(printf '%s' "$RAW_PORT" | tr -d '\r\n' | tr -d '[:space:]')"
          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST is empty" >&2
            exit 1
          fi
          if [ -z "$PORT" ]; then PORT=22; fi
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_PORT must be a number (got non-numeric after trim)" >&2
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="/var/www/tourpilot"; fi
            cd "$DEPLOY_DIR"
            git pull --ff-only || true

            OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            export API_IMAGE="ghcr.io/${OWNER}/tourpilot-api:${{ needs.build-and-push.outputs.sha }}"
            export WEB_IMAGE="ghcr.io/${OWNER}/tourpilot-web:${{ needs.build-and-push.outputs.sha }}"
            export BUILD_SHA="${{ needs.build-and-push.outputs.sha }}"
            export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USER }}" --password-stdin

            docker compose -f docker-compose.prod.yml --env-file .env pull api web
            # If USE_CADDY_EDGE=true (set by wire-caddy.sh), keep the edge profile
            # so recreating api/web does not drop the Caddy container on 80/443.
            if grep -qE '^USE_CADDY_EDGE=true' .env 2>/dev/null; then
              docker compose -f docker-compose.prod.yml --env-file .env --profile edge up -d --force-recreate api web
            else
              docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate api web
            fi

            # Entrypoint runs prisma db push; wait until API is healthy (schema applied).
            echo "Waiting for API health (includes Prisma sync)..."
            ok=0
            for i in $(seq 1 60); do
              if docker compose -f docker-compose.prod.yml --env-file .env exec -T api \
                node -e "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "API did not become healthy — recent logs:" >&2
              docker compose -f docker-compose.prod.yml --env-file .env logs --tail=80 api >&2 || true
              exit 1
            fi

            docker image prune -f
            curl -fsS http://127.0.0.1/api/health || curl -fsS http://127.0.0.1:8080/api/health
            echo "Deployed $BUILD_SHA (Prisma schema synced on API start)"
