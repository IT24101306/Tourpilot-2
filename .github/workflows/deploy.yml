name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/tourpilot-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/tourpilot-web

jobs:
  build-and-push:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${OWNER}/tourpilot-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER}/tourpilot-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}:latest
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}:latest
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="/var/www/tourpilot"; fi
            cd "$DEPLOY_DIR"
            git pull --ff-only || true

            OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            export API_IMAGE="ghcr.io/${OWNER}/tourpilot-api:${{ needs.build-and-push.outputs.sha }}"
            export WEB_IMAGE="ghcr.io/${OWNER}/tourpilot-web:${{ needs.build-and-push.outputs.sha }}"
            export BUILD_SHA="${{ needs.build-and-push.outputs.sha }}"
            export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USER }}" --password-stdin

            docker compose -f docker-compose.prod.yml --env-file .env pull api web
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f

            sleep 8
            curl -fsS http://127.0.0.1/api/health || curl -fsS http://127.0.0.1:8080/api/health
            echo "Deployed $BUILD_SHA"
