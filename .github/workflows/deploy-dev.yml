name: Deploy (dev)

on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/tourpilot-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/tourpilot-web

jobs:
  build-and-push:
    name: Build Docker images (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${OWNER}/tourpilot-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER}/tourpilot-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}:dev
            ${{ steps.meta.outputs.api }}:dev-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: |
            VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
          tags: |
            ${{ steps.meta.outputs.web }}:dev
            ${{ steps.meta.outputs.web }}:dev-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on VPS (self-hosted)
    needs: build-and-push
    if: github.ref == 'refs/heads/development' && vars.DEPLOY_USE_SELF_HOSTED == 'true'
    runs-on: [self-hosted, linux, tourpilot]
    steps:
      - uses: actions/checkout@v4
      - name: Pull images & recreate dev stack
        env:
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash scripts/ci-deploy.sh dev "${{ needs.build-and-push.outputs.sha }}"

  deploy-ssh:
    name: Deploy via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && vars.DEPLOY_USE_SELF_HOSTED != 'true'
    steps:
      - name: Normalize SSH target
        id: ssh
        env:
          RAW_HOST: ${{ secrets.DEPLOY_HOST }}
          RAW_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          HOST="$(printf '%s' "$RAW_HOST" | tr -d '\r\n' | tr -d '[:space:]')"
          PORT="$(printf '%s' "$RAW_PORT" | tr -d '\r\n' | tr -d '[:space:]')"
          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST is empty" >&2
            exit 1
          fi
          if [ -z "$PORT" ]; then PORT=22; fi
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_PORT must be a number" >&2
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH port
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set +e
          for i in 1 2 3 4 5 6; do
            echo "SSH probe $i/6 → ${HOST}:${PORT}"
            if timeout 15 bash -c "echo >/dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
              echo "Port is open"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "Port ${HOST}:${PORT} unreachable from GitHub (dial timeout)." >&2
          echo "Permanent fix: self-hosted runner — see docs/DEPLOY.md" >&2
          exit 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEV_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="/var/www/tourpilot-dev"; fi
            cd "$DEPLOY_DIR"
            git fetch origin --prune
            git reset --hard origin/development
            git clean -fd -e .env -e .env.local -e '*.pem' -e '*.key'
            export DEV_DEPLOY_PATH="$DEPLOY_DIR"
            export GHCR_PULL_USER="${{ secrets.GHCR_PULL_USER }}"
            export GHCR_PULL_TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"
            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"
            if [ ! -f scripts/ci-deploy.sh ]; then
              echo "scripts/ci-deploy.sh still missing after reset to origin/development" >&2
              exit 1
            fi
            bash scripts/ci-deploy.sh dev "${{ needs.build-and-push.outputs.sha }}"
