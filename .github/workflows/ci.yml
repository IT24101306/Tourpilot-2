name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build -w @tourpilot/shared

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: npx prisma generate

      - name: Build API
        run: npm run build -w @tourpilot/api

      - name: Build web
        run: npm run build -w @tourpilot/web
