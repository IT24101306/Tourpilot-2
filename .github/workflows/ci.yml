name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Include sha so re-running an old failed run cannot cancel CI for a newer commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        env:
          # Required by apps/api postinstall → prisma generate (prisma.config.ts)
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: npm ci

      - name: Build shared
        run: npm run build -w @tourpilot/shared

      - name: Build API
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: npm run build -w @tourpilot/api

      - name: Build web
        run: npm run build -w @tourpilot/web