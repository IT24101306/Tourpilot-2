services:
  mysql:
    image: mysql:8.4
    container_name: tourpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tourpilot
      MYSQL_USER: tourpilot
      MYSQL_PASSWORD: tourpilot
    ports:
      - "3306:3306"
    volumes:
      - tourpilot_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  tourpilot_mysql_data:
