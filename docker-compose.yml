# Local development — MySQL only
# Usage: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: tourpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tourpilot
      MYSQL_USER: tourpilot
      MYSQL_PASSWORD: tourpilot
    ports:
      - "3306:3306"
    volumes:
      - tourpilot_mysql_data:/var/lib/mysql
    command: --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tourpilot_mysql_data:
