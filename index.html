<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IYYO — A scroll-controlled premium robot showcase."
    />
    <title>IYYO Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-landing">
    <div id="loader" class="cmd-loader" aria-live="polite" aria-busy="true">
      <div class="cmd-window">
        <div class="cmd-titlebar">
          <span class="cmd-dot cmd-dot--red"></span>
          <span class="cmd-dot cmd-dot--yellow"></span>
          <span class="cmd-dot cmd-dot--green"></span>
          <span class="cmd-title">IYYO Showcase — Command Prompt</span>
        </div>
        <div class="cmd-body">
          <div id="terminal-output" class="terminal-output"></div>
          <div class="terminal-input-line">
            <span class="terminal-prompt">C:\IYYO\showcase&gt;</span>
            <span id="terminal-typing" class="terminal-typing"></span
            ><span class="terminal-cursor" aria-hidden="true">█</span>
          </div>
        </div>
      </div>
    </div>

    <nav class="site-nav site-nav--side" id="site-nav" aria-label="Main navigation">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">
          <span class="nav-logo-text">IYYO</span>
        </a>
        <ul class="nav-links">
          <li><a href="about.html">About Us</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="mailto:hello@iyyo.solutions">Contact Us</a></li>
        </ul>
        <button
          type="button"
          class="nav-toggle"
          id="nav-toggle"
          aria-expanded="false"
          aria-controls="nav-menu-mobile"
          aria-label="Open menu"
        >
          <span></span><span></span>
        </button>
      </div>
      <ul class="nav-links-mobile" id="nav-menu-mobile" hidden>
        <li><a href="about.html">About Us</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="mailto:hello@iyyo.solutions">Contact Us</a></li>
      </ul>
    </nav>

    <main id="main" class="main hidden" tabindex="-1">
      <section
        class="scroll-experience"
        id="projects"
        aria-label="Robot showcase scroll experience"
      >
        <div class="pin-viewport" id="pin-viewport">
          <div class="chamber" id="chamber">
            <div class="robot-stage" id="robot-stage">
              <canvas id="robot-canvas" aria-label="IYYO robot product view"></canvas>
            </div>

            <div class="story-ui" id="story-ui">
              <div class="story-card white-glass" id="story-card">
                <time class="story-clock" id="story-clock" datetime=""></time>
                <div class="story-text-wrap" id="story-text-wrap">
                  <h2 class="story-title" id="story-title">Intelligence in form.</h2>
                  <p class="story-copy" id="story-copy">
                    Scroll to evolve the machine in place — precision, structure,
                    orbit.
                  </p>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/frames.manifest.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
